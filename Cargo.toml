[package]
name = "pbput"
version = "0.1.0"
edition = "2024"
description = "Put typed data directly onto the macOS pasteboard from files or stdin"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
infer = "0.22.0"
objc2 = "0.6.4"
objc2-app-kit = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "std",
  ]
}
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSURL",
    "std",
  ]
}
objc2-uniform-type-identifiers = {
  version = "0.3.2",
  default-features = false,
  features = [
    "UTCoreTypes",
    "UTType",
    "std",
  ]
}
uuid = { version = "1.26.0", features = ["v4"] }

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
