name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  BIN_NAME: pbput
jobs:
  check-version:
    # AppKit/UniformTypeIdentifiers bindings only build on Apple platforms.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version ($pkg_version)"
            exit 1
          fi
  build:
    needs: check-version
    name: Build for ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: cp "target/${{ matrix.target }}/release/$BIN_NAME" "$BIN_NAME-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-*
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum "$BIN_NAME"-* > SHA256SUMS
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
